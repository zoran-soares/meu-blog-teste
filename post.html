<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Artigo - Meu Blog Teste</title>
<style>body{font-family:Arial,sans-serif;margin:0;background:#f4f5f7;color:#2b2d42}nav{background:#fff;padding:20px 30px;border-bottom:3px solid #0056b3}nav a{color:#0056b3;text-decoration:none;font-weight:bold}.container{max-width:800px;margin:40px auto;background:#fff;padding:30px}.meta{color:#777;font-size:14px}#conteudo{line-height:1.7}#conteudo h1,#conteudo h2,#conteudo h3{color:#1d1e2c}</style></head>
<body><nav><a href="blog.html">← Voltar para o blog</a></nav><main class="container"><h1 id="titulo">Carregando...</h1><p id="data" class="meta"></p><p id="resumo"></p><div id="conteudo"></div></main>
<script>
const API='https://api.github.com/repos/zoran-soares/meu-blog-teste/contents/posts/'; const RAW='https://raw.githubusercontent.com/zoran-soares/meu-blog-teste/main/posts/';
function parse(t){const m=t.match(/^---\s*\n([\s\S]*?)\n---\s*\n([\s\S]*)$/);const d={};if(!m)return{d,b:t};m[1].split(/\r?\n/).forEach(l=>{const i=l.indexOf(':');if(i>=0){let v=l.slice(i+1).trim().replace(/^['"]|['"]$/g,'');d[l.slice(0,i).trim()]=v}});return{d,b:m[2]}}
function md(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/^### (.*)$/gm,'<h3>$1</h3>').replace(/^## (.*)$/gm,'<h2>$1</h2>').replace(/^# (.*)$/gm,'<h1>$1</h1>').replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/\*(.*?)\*/g,'<em>$1</em>').replace(/\n\n+/g,'</p><p>').replace(/^(.+)$/gm, m=>m.startsWith('<h')||m.startsWith('</p>')?m:'<p>'+m+'</p>')}
async function load(){const slug=new URLSearchParams(location.search).get('slug');if(!slug){document.getElementById('titulo').textContent='Artigo não informado';return}try{const name=slug.endsWith('.md')?slug:slug+'.md';const r=await fetch(RAW+encodeURIComponent(name));if(!r.ok)throw Error(r.status);const {d,b}=parse(await r.text());document.title=(d.titulo||'Artigo')+' - Meu Blog Teste';document.getElementById('titulo').textContent=d.titulo||slug;document.getElementById('data').textContent=d.data||'';document.getElementById('resumo').textContent=d.resumo||'';document.getElementById('conteudo').innerHTML=md(b)}catch(e){document.getElementById('titulo').textContent='Artigo não encontrado'}}load();
</script></body></html>
