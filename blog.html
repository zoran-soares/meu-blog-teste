<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog - Meu Blog Teste</title>
  <style>
    :root{--cor-principal:#0056b3;--cor-destaque:#17a2b8;--cor-texto:#2b2d42;--cor-titulo:#1d1e2c;--cor-fundo:#f4f5f7}
    *{box-sizing:border-box} body{font-family:Arial,sans-serif;margin:0;background:var(--cor-fundo);color:var(--cor-texto)}
    nav{background:#fff;padding:20px 30px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 10px rgba(0,0,0,.05);border-bottom:3px solid var(--cor-principal)}
    nav .logo{color:var(--cor-principal);font-size:22px;font-weight:bold;text-decoration:none} nav ul{list-style:none;margin:0;padding:0;display:flex;gap:25px} nav a{color:var(--cor-texto);text-decoration:none} nav a:hover{color:var(--cor-destaque)}
    .container{max-width:800px;margin:40px auto;padding:30px;background:#fff;border-radius:6px;box-shadow:0 4px 12px rgba(0,0,0,.05)}
    h1{color:var(--cor-principal);border-bottom:2px solid #e9ecef;padding-bottom:10px;margin-bottom:30px}.post-card{margin-bottom:40px;padding-bottom:25px;border-bottom:1px solid #e9ecef}.post-card:last-child{border-bottom:0}.post-card h2{margin-top:0;color:var(--cor-titulo)}.read-more{display:inline-block;margin-top:10px;color:var(--cor-principal);font-weight:bold}.meta{font-size:13px;color:#777}
    footer{background:#1d1e2c;color:#fff;padding:30px 20px;margin-top:60px;text-align:center;font-size:14px;border-top:4px solid var(--cor-principal)} footer p{margin:5px 0;color:#b8b9c3}
  </style>
</head>
<body>
<nav><a href="index.html" class="logo">MEU BLOG TESTE</a><ul><li><a href="index.html">Home</a></li><li><a href="blog.html"><strong>Blog</strong></a></li><li><a href="admin/">Painel</a></li></ul></nav>
<div class="container"><h1>Artigos Publicados</h1><div id="feed-artigos"><p>Carregando artigos...</p></div></div>
<footer><p>&copy; 2026 Meu Blog Teste</p></footer>
<script>
const REPO_API='https://api.github.com/repos/zoran-soares/meu-blog-teste/contents/posts?ref=main';
const RAW_BASE='https://raw.githubusercontent.com/zoran-soares/meu-blog-teste/main/posts/';
function parseFrontMatter(text){
  const match=text.match(/^---\s*\n([\s\S]*?)\n---\s*\n([\s\S]*)$/);
  const data={}; if(!match)return {data,body:text};
  match[1].split(/\r?\n/).forEach(line=>{const i=line.indexOf(':');if(i<0)return;let k=line.slice(0,i).trim(),v=line.slice(i+1).trim();v=v.replace(/^['"]|['"]$/g,'');data[k]=v});
  return {data,body:match[2]};
}
function esc(s=''){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
async function carregarPosts(){
  const el=document.getElementById('feed-artigos');
  try{
    const r=await fetch(REPO_API,{headers:{Accept:'application/vnd.github+json'}});
    if(!r.ok)throw new Error('GitHub API: '+r.status);
    const files=(await r.json()).filter(x=>x.type==='file'&&x.name.toLowerCase().endsWith('.md'));
    if(!files.length){el.innerHTML='<p>Nenhum artigo publicado ainda.</p>';return}
    const posts=await Promise.all(files.map(async f=>{const t=await (await fetch(RAW_BASE+encodeURIComponent(f.name))).text();const p=parseFrontMatter(t);return {...p.data,slug:f.name.replace(/\.md$/i,'')};}));
    posts.sort((a,b)=>(b.data||'').localeCompare(a.data||''));
    el.innerHTML=posts.map(p=>`<article class="post-card"><h2>${esc(p.titulo||p.slug)}</h2><p class="meta">${esc(p.data||'')}</p><p>${esc(p.resumo||'')}</p><a class="read-more" href="post.html?slug=${encodeURIComponent(p.slug)}">Ler artigo completo →</a></article>`).join('');
  }catch(e){console.error(e);el.innerHTML='<p>Não foi possível carregar os artigos agora. Verifique se o repositório está público e se há arquivos .md em <code>posts/</code>.</p>'}
}
carregarPosts();
</script>
</body></html>
